apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: thanosbench-work
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ocs-storagecluster-ceph-rbd
  resources:
    requests:
      storage: 50Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: thanosbench-pilot
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/arch: amd64
        node-role.kubernetes.io/worker: ""
      initContainers:
      - name: stage
        image: public.ecr.aws/aws-cli/aws-cli:2.38.1
        command: [/bin/bash, -ec]
        args:
        - |
          mkdir -p /work/runner
          until test -x /work/runner/thanosbench; do sleep 2; done
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: work
          mountPath: /work
      containers:
      - name: generate
        image: public.ecr.aws/aws-cli/aws-cli:2.38.1
        command: [/bin/bash, /runner/generate_and_publish.sh]
        envFrom:
        - configMapRef:
            name: thanosbench-settings
        env:
        - name: HOME
          value: /tmp
        - name: AWS_PAGER
          value: ""
        - name: AWS_SHARED_CREDENTIALS_FILE
          value: /credentials/credentials
        - name: GOMAXPROCS
          value: "8"
        - name: GOMEMLIMIT
          value: 16GiB
        - name: TB
          value: /work/runner/thanosbench
        - name: WORK
          value: /work/data
        - name: MANIFEST
          value: /work/data/manifest.final.json
        resources:
          requests:
            cpu: "8"
            memory: 32Gi
          limits:
            memory: 64Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: work
          mountPath: /work
        - name: runner
          mountPath: /runner
          readOnly: true
        - name: aws
          mountPath: /credentials
          readOnly: true
      volumes:
      - name: work
        persistentVolumeClaim:
          claimName: thanosbench-work
      - name: runner
        configMap:
          name: thanosbench-runner
      - name: aws
        secret:
          secretName: thanosbench-aws
